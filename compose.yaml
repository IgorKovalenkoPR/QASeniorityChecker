services:
  qasc:
    build:
      context: .
      target: runtime
    image: qa-seniority-checker:latest
    restart: unless-stopped
    ports:
      - "${QASC_PORT:-3000}:3000"
    environment:
      # Required, and deliberately without a default: the per-attempt option ids
      # are HMACed with it, so a value that changes between deploys invalidates
      # every attempt in flight. Compose refuses to start without it rather than
      # inventing one silently.
      QASC_OPTION_SECRET: ${QASC_OPTION_SECRET:?set QASC_OPTION_SECRET to a stable value of at least 32 characters}
      # Optional. While unset, the admin endpoints answer 503.
      QASC_ADMIN_TOKEN: ${QASC_ADMIN_TOKEN:-}
      # The SPA and the API are served from one origin here, so no cross-origin
      # request ever happens and the allow-list can stay empty.
      QASC_CORS_ORIGIN: ${QASC_CORS_ORIGIN:-}
      QASC_ATTEMPT_SECONDS: ${QASC_ATTEMPT_SECONDS:-1800}
      # How long the server tolerates client silence before it records a gap.
      # Deliberately generous: a VPN reconnect alone can outlast a short window,
      # and a gap the candidate cannot see is a gap they cannot contest.
      QASC_HEARTBEAT_SECONDS: ${QASC_HEARTBEAT_SECONDS:-15}
      QASC_HEARTBEAT_GRACE_SECONDS: ${QASC_HEARTBEAT_GRACE_SECONDS:-120}
      # Off by default. Turning this on shows every candidate the correct answers
      # and the explanations for their twenty questions, which is enough to walk
      # the whole 504-question bank out of the building a variant at a time.
      QASC_REVEAL_ANSWERS_TO_CANDIDATE: ${QASC_REVEAL_ANSWERS_TO_CANDIDATE:-false}
    volumes:
      # The SQLite file holds every attempt and its integrity log. Without this
      # volume a redeploy discards the results of anyone mid-review.
      - qasc-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  qasc-data:
